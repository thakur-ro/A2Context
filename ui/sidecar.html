<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusWeave</title>
  <link rel="icon" href="/nexusweave.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/sidecar.css">
  <script src="/workspace.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="shell masthead">
      <a class="brand" href="/"><img src="/nexusweave.svg" width="25" height="25" alt=""> NexusWeave</a>
      <div class="workspace-controls"><span id="environment"></span><button id="appearance" type="button" hidden></button></div>
    </div>
    <nav id="navigation" class="shell" aria-label="Workspace"></nav>
  </header>
  <div class="workspace-layout">
  <aside id="workflow-sidebar" hidden><nav aria-label="Workflows" id="workflow-navigation"></nav></aside>
  <main class="shell" id="workspace">
    <div class="heading">
      <div><h1 id="title">Recommendations</h1><p id="summary"></p></div>
      <details id="filters">
        <summary>Filters<span id="filter-count"></span></summary>
        <form id="filter-form">
          <label>From (UTC)<input type="date" name="after"></label>
          <label>Before (UTC)<input type="date" name="before"></label>
          <label>Organization<input name="org"></label>
          <label>User<input name="user"></label>
          <label>Workflow<input name="workflow"></label>
          <label>Metadata key<select name="meta_key"><option value="">Any key</option></select></label>
          <label>Metadata value<input name="meta_value"></label>
          <div class="actions"><button type="submit">Apply filters</button><a id="reset">Reset</a></div>
        </form>
      </details>
    </div>
    <div id="scope"></div>

    <div id="content"></div>
    <nav id="pagination" aria-label="Pages"></nav>
    <details id="capture"><summary>Capture coverage</summary><p id="status" role="status"></p></details>
    <p id="error" role="alert"></p>
  </main>
  </div>
</body>
</html>
