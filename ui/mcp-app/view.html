<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusWeave evidence</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: light-dark(#f8f7f3, #1c201f);
      --ink: light-dark(#242d30, #ecf0ed);
      --muted: light-dark(#515d5d, #b1bfba);
      --line: light-dark(#d8ded8, #414944);
      --accent: light-dark(#254f68, #b5d8ee);
      --accent-fill: light-dark(#e1ecf1, #273e4b);
      font: 15px/1.5 system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    body { margin: 0; padding: 1rem; overflow-wrap: anywhere; }
    h1, h2, h3, p { margin: 0 0 .45rem; }
    h1 { font-size: 1.25rem; letter-spacing: -.025em; }
    h2 { font-size: 1.1rem; }
    h3 { font-size: .95rem; }
    button { color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: .4rem;
      padding: .35rem .55rem; font: inherit; cursor: pointer; text-align: start; }
    button:hover { background: var(--accent-fill); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input, select { color: var(--ink); background: var(--paper); border: 1px solid var(--line);
      border-radius: .35rem; padding: .35rem; font: inherit; }
    input { width: 4rem; }
    .muted, small { color: var(--muted); }
    .receipt-json { white-space: pre-wrap; overflow-wrap: anywhere; }
    .row { border-top: 1px solid var(--line); padding: .6rem 0; }
    .row button { margin-bottom: .25rem; }
    .actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .65rem; }
    .activation-controls { align-items: center; margin-bottom: .65rem; }
    .back { margin-bottom: .6rem; }
    .visibility-controls { display: block; margin: .6rem 0; }
    .visibility-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; margin: .6rem 0; }
    .visibility-columns > section { padding: .65rem; border: 1px solid var(--line); border-radius: .45rem; }
    .visibility-range { position: relative; display: block; max-width: 12rem; height: .5rem; background: var(--accent-fill); border-radius: .4rem; margin-bottom: .35rem; }
    .visibility-range::before { content: ""; position: absolute; height: 100%; left: 50%; border-left: 1px solid var(--line); }
    .visibility-range > span { position: absolute; height: 100%; min-width: 2px; background: var(--accent); border-radius: .4rem; transform: translateX(-1px); }
    .inspector-path { font-family: ui-monospace, monospace; }
    .source-paths :is(p, code) { display: block; margin: .35rem 0 0; }
    .source-versions { margin: .35rem 0; padding-inline-start: 1.2rem; }
    .source-filters { align-items: end; margin-block: .65rem; }
    .source-filters input { width: min(11rem, 100%); }
    @media (max-width: 460px) { .visibility-columns { grid-template-columns: minmax(0, 1fr); } }
    @media (pointer: coarse) { button { min-height: 44px; } }
  </style>
</head>
<body>
  <main id="result">
    <h1>NexusWeave evidence</h1>
    <p class="muted" role="status">Waiting for query results…</p>
  </main>
  <!-- BUNDLE -->
</body>
</html>
