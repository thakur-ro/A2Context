name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo +stable fmt --all --check
      - name: Lint Rust
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo +stable test --locked
      - name: Verify sidecar with JSON and OpenTelemetry SDK producers
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/a2context-otel"
          "$RUNNER_TEMP/a2context-otel/bin/pip" install opentelemetry-exporter-otlp-proto-http==1.45.2
          make check-sidecar SDK_PYTHON="$RUNNER_TEMP/a2context-otel/bin/python"
      - name: Verify saved public QA rankings and passage-order comparison
        if: runner.os == 'Linux'
        run: make check-qa check-dispatch-study
      - name: Verify the installable crate
        if: runner.os == 'Linux'
        run: cargo +stable package --locked
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps
      - name: Check browser JavaScript
        run: |
          for source in ui/*.js; do node --check "$source" || exit 1; done
          node --test tests/*.test.mjs
      - name: Exercise desktop and mobile dashboard journeys
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/dashboard-browser" --no-audit --no-fund playwright-core@1.57.0
          "$RUNNER_TEMP/dashboard-browser/node_modules/.bin/playwright-core" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/dashboard-browser/node_modules/playwright-core/index.mjs" make check-ui
      - name: Check bundled views
        run: make check-bundles

  shipping-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_doc_links.py
      - run: make verify-image
