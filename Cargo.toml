[package]
name = "nexusweave"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Diagnose context and inspect decisions in LLM workflows"
repository = "https://github.com/thakur-ro/NexusWeave"
documentation = "https://github.com/thakur-ro/NexusWeave/blob/main/docs/rust-api.md"
include = [
    "/src/**",
    "/ui/*.js",
    "/ui/*.html",
    "/ui/*.css",
    "/ui/mcp-app/*.json",
    "/ui/mcp-app/*.html",
    "/ui/mcp-app/*.js",
    "/ui/mcp-app/*.mjs",
    "/tests/**",
    "/fixtures/**",
    "/examples/**",
    "/schema/**",
    "/scripts/**",
    "/docs/**",
    "/README.md",
    "/CONTRIBUTING.md",
    "/CREDITS.md",
    "/LICENSE",
    "/LICENSES/**",
]

[dependencies]
flate2 = "1"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["trace", "gen-tonic-messages", "with-serde"] }
percent-encoding = "2"
prost = "0.14"
regex = "1"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt"] }
