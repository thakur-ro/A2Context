[package]
name = "a2context"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Find context conflicts and test source edits in LLM workflows"
repository = "https://github.com/thakur-ro/A2Context"
documentation = "https://github.com/thakur-ro/A2Context/blob/main/docs/rust-api.md"
include = [
    "/src/**",
    "/ui/*.js",
    "/ui/*.html",
    "/ui/*.css",
    "/ui/*.svg",
    "/ui/a2ui/*.json",
    "/ui/a2ui/*.js",
    "/ui/a2ui/*.mjs",
    "/ui/mcp-app/*.json",
    "/ui/mcp-app/*.html",
    "/ui/mcp-app/*.js",
    "/ui/mcp-app/*.mjs",
    "/tests/**",
    "/fixtures/**",
    "/examples/preflight-returns.json",
    "/examples/preflight-returns-langsmith.json",
    "/examples/chat-partner/serve.py",
    "/examples/exchange-approval/demo.py",
    "/examples/exchange-approval/first_span.py",
    "/examples/exchange-approval/fixture-trials.json",
    "/examples/exchange-approval/scenario.json",
    "/examples/exchange-approval/pending.json",
    "/examples/exchange-approval/exchange.otlp.json",
    "/schema/**",
    "/scripts/check_browser.py",
    "/scripts/check_doc_links.py",
    "/scripts/check_image.py",
    "/scripts/check_sidecar.py",
    "/scripts/record_demo.mjs",
    "/scripts/replay_synthetic.py",
    "/docs/architecture.md",
    "/docs/chat-canvas.md",
    "/docs/demo.md",
    "/docs/foundational-algorithms.md",
    "/docs/getting-started.md",
    "/docs/guide.md",
    "/docs/methods.md",
    "/docs/research-review.md",
    "/docs/rust-api.md",
    "/docs/sidecar.md",
    "/docs/validation.md",
    "/docs/media/exchange-approval.gif",
    "/docs/media/exchange-approval.mp4",
    "/README.md",
    "/DEPLOYMENT.md",
    "/Dockerfile",
    "/.dockerignore",
    "/Makefile",
    "/deploy/**",
    "/CONTRIBUTING.md",
    "/CREDITS.md",
    "/LICENSE",
    "/LICENSES/**",
    "!**/__pycache__/**",
]

[dependencies]
flate2 = "1"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["trace", "gen-tonic-messages", "with-serde"] }
percent-encoding = "2"
prost = "0.14"
regex = "1"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt"] }
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
